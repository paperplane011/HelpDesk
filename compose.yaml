name: helpdesk
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run scripts/New-LocalSettings.ps1 first}
    ports:
      - "127.0.0.1:${SQL_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__HelpDesk: "Server=db,1433;Database=HelpDesk;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      HelpDesk__MigrateOnStartup: "true"
      HelpDesk__SeedDemo: "true"
      HelpDesk__DemoPassword: ${HELPDESK_DEMO_PASSWORD:?Run scripts/New-LocalSettings.ps1 first}
      HelpDesk__EnableSwagger: "true"
      HelpDesk__DataProtectionPath: /app/keys
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    volumes:
      - api-keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  sql-data:
  api-keys:
